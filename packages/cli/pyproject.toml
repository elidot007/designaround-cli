[project]
name = "designaround"
version = "0.1.4"
description = "DesignAround CLI + local engine: design-patent screening, design-around, patent views and filing packages. Works with Claude Code, Codex, Cursor, Gemini CLI, OpenCode, OpenClaw and Kiro via the bundled Skill."
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    "designaround-engine",
    "designaround-core",
    "typer==0.27.3",
    "rich==15.0.0",
    "httpx==0.28.1",
    "keyring==25.7.0",
    "pyyaml==6.0.3",
]

[project.scripts]
designaround = "designaround_cli.main:run"
da = "designaround_cli.main:run"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designaround_cli"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "hatch_build.py", "README.md", "pyproject.toml"]

# Skill + agent runtime sources are bundled by hatch_build.py (repo or sdist).
[tool.hatch.build.hooks.custom]
