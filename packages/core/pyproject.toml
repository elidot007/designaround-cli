[project]
name = "designaround-core"
version = "0.1.4"
description = "Pure-Python shared rules for DesignAround: price catalog, official fees, filing/timeline/representation rule packs, quotes."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml==6.0.3"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designaround_core"]
