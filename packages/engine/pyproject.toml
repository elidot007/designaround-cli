[project]
name = "designaround-engine"
version = "0.1.3"
description = "DesignAround local engine: CAD execution, patent views, rendering, CPU shape comparison, DFM, filing packages."
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "cadquery==2.8.0",
    "trimesh==5.2.0",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pillow==13.0.0",
    "pyyaml==6.0.3",
    "reportlab==5.1.0",
    "rtree==1.4.1",
    "python-docx==1.2.0",
    "pypdf==6.21.4",
    "fast-simplification==0.2.0",
    "designaround-core",
]

[project.scripts]
designaround-engine-rpc = "designaround_engine.rpc:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designaround_engine"]
